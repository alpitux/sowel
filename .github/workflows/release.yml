name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      test_tag:
        description: "Tag suffix for test images (e.g. ci-test). Pushes :<test_tag> and :<test_tag>-arm64. Does NOT touch :latest."
        required: false
        default: "ci-test"
      restore_latest_from:
        description: "If set (e.g. 1.5.9), the workflow skips builds and only repoints :latest to :<this version>."
        required: false
        default: ""

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ── Restore :latest tag (manual recovery only) ───────────
  # Triggered only via workflow_dispatch with restore_latest_from set.
  # Useful if a test run accidentally overwrote :latest.
  restore-latest:
    if: github.event_name == 'workflow_dispatch' && inputs.restore_latest_from != ''
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Repoint :latest to :${{ inputs.restore_latest_from }}
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          FROM: ${{ inputs.restore_latest_from }}
        run: |
          docker buildx imagetools create --tag ${REPO}:latest ${REPO}:${FROM}

  # ── CI checks ─────────────────────────────────────────────
  ci:
    if: github.event_name != 'workflow_dispatch' || inputs.restore_latest_from == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: TypeScript check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint src/ --ext .ts

      - name: Tests
        run: npx vitest run

      - name: UI checks
        run: |
          cd ui && npm ci
          npm run lint
          npx tsc -b --noEmit

  # ── Docker build + push (amd64, priority) ────────────────
  docker:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.test_tag }}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Compute image tags
        id: tags
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          V: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          tags="${REPO}:${V}"
          if [[ "$IS_RELEASE" == "true" ]]; then
            tags="${tags}"$'\n'"${REPO}:latest"
          fi
          {
            echo 'list<<EOF'
            echo "$tags"
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - name: Build and push (amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=amd64
          cache-to: type=gha,scope=amd64,mode=max

  # ── Docker build (arm64, async, non-blocking) ────────────
  # Runs after the amd64 image is published, then promotes the main
  # tags to a multi-arch manifest combining both architectures.
  # Failure here does NOT fail the release — amd64 image stays valid,
  # the main tags just remain amd64-only until the next release.
  docker-arm64:
    needs: docker
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "version=${{ inputs.test_tag }}" >> $GITHUB_OUTPUT
            echo "is_release=false" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT
            echo "is_release=true" >> $GITHUB_OUTPUT
          fi

      - name: Build and push (arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}-arm64
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest-arm64
          cache-from: type=gha,scope=arm64
          cache-to: type=gha,scope=arm64,mode=max

      - name: Promote tags to multi-arch manifest
        env:
          REPO: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          V: ${{ steps.version.outputs.version }}
          IS_RELEASE: ${{ steps.version.outputs.is_release }}
        run: |
          docker buildx imagetools create --tag ${REPO}:${V} ${REPO}:${V} ${REPO}:${V}-arm64
          if [[ "$IS_RELEASE" == "true" ]]; then
            docker buildx imagetools create --tag ${REPO}:latest ${REPO}:latest ${REPO}:latest-arm64
          fi

  # ── Create GitHub Release (after BOTH archs are pushed) ──
  # Gated behind docker-arm64 so the Release is not visible until the
  # multi-arch manifest exists. Otherwise arm64 instances (Pi) would
  # see "update available" while `docker pull` still fails for them.
  # arm64 stays continue-on-error, so a broken arm64 build does not
  # prevent the Release — but in that case the main tag remains
  # amd64-only and arm64 users see no update (correct behaviour).
  release:
    needs: [docker, docker-arm64]
    if: always() && needs.docker.result == 'success' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ github.ref_name }}
        run: |
          gh release create "$V" \
            --title "Sowel ${V#v}" \
            --generate-notes
